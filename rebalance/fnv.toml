# Rebalance table for New Vegas: how source weapons, armour, ammunition, aid items
# and people become Fallout 2 prototypes, and the converter's own tables
# ([convert]: weapon classes, which side a person is on, loot draws).
#
# This file is a full copy of the built-in defaults (emit::rebalance and
# mojave_convert::rebalance). mojave-convert reads it when it sits in a
# rebalance/ directory beside the slice file or above it, or when it is
# named with --rebalance <file>. Every key here overlays the default:
# delete a key to keep its default, change one to tune it; an unknown key
# is an error. Only the effective values are hashed into the map stage's
# cache key (loot on), so an unchanged copy rebuilds nothing.
#
# Tuning: [damage] scale and spread set weapon damage; [ap] the action
# point costs; [armor] how DR and DT become Fallout 2 resistances; [critter]
# hit points, skills and experience of fighters; [classes.<class>] the
# weapon code (art letter), attack modes and ranges of each class;
# [convert.weapons] which class a weapon record takes; [convert.hostility]
# the hostile team and AI packet; [convert.loot] the leveled-list level.

