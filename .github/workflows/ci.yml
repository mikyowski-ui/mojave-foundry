name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-24.04
    # The pinned vault-engine dependency may be a private repository. If so,
    # provide a read-only token for it as the VAULT_ENGINE_TOKEN secret.
    env:
      VAULT_ENGINE_TOKEN: ${{ secrets.VAULT_ENGINE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Authenticate the vault-engine fetch
        if: ${{ env.VAULT_ENGINE_TOKEN != '' }}
        run: |
          git config --global url."https://x-access-token:${VAULT_ENGINE_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      # Software Vulkan, so the renderer tests have an adapter.
      - name: Install a software GPU driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: No game data in the tree
        run: |
          if git ls-files | grep -iE '\.(bsa|esm|esp|dat|frm|fr[0-5]|map|nif|dds|pal|pro|acm|int)$'; then
            echo "game data file types are tracked" >&2
            exit 1
          fi
