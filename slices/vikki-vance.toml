# Vikki & Vance casino: an interior demo room (owner brief, 2026-11-22).
# Coordinates only: the Primm exterior cells (slices/primm.toml), through
# whose doors extract reaches the room, and the room's cell editor id.
# Run with --standalone; see README.md. Everyone the data places is placed.
# Floor and window centre: the defaults (the main casino floor, z 7296).
# The gaming pit is 64 units lower (z 7232), on the same navmesh storey:
# walk_band and floor_band reach down 80 so the pit is walkable, its
# people (Ruby Nash, three Primm Residents, four dealers) are placed
# rather than left out "on another level", and its gaming tables are no
# longer dropped "below the floor".
# Ceiling cut 210 (the default), chosen on engine frames at 150 and 210:
# the hall is open at 210, and 150 cuts the roof off the display car in
# the pit and the top off the cashier's cage while revealing little more.
name = "vikki-vance"
worldspace = "WastelandNV"
plugins = ["FalloutNV.esm"]
x = [-16, -11]
y = [-16, -11]
interior_depth = 1
interior = "VikkiAndVance"
place_disabled = true
walk_band = [-80.0, 100.0]
floor_band = [-80.0, 32.0]
cut_height = 210.0
