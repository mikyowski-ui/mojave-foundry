# The Prospector Saloon: an interior demo room (owner brief, 2026-11-22).
# Coordinates only: the Goodsprings exterior cells (the built-in
# goodsprings slice's), through whose doors extract reaches the room, and
# the room's cell editor id. Run with --standalone; see README.md.
# Floor and window centre: the defaults (the largest navmesh storey and the
# centre of its navmesh). Everyone the data places is placed.
# Ceiling cut 150 (default 210), chosen on engine frames at 120, 150 and
# 210: the partitions no longer hide the pool table and the people behind
# them, and the jukebox keeps its top (at 120 it is cut).
name = "saloon"
worldspace = "WastelandNV"
plugins = ["FalloutNV.esm"]
x = [-21, -14]
y = [-4, 3]
interior_depth = 1
interior = "GSProspectorSaloonInterior"
place_disabled = true
cut_height = 150.0
