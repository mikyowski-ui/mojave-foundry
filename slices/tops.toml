# The Tops casino: an interior demo room (owner brief, 2026-11-22).
# Coordinates only: the Strip exterior cells (slices/strip.toml), through
# whose doors extract reaches the room, and the room's cell editor id.
# Run with --standalone; see docs/running.md. Everyone the data places is placed.
# The navmesh is one storey by gap splitting, joined by stairs: a main floor
# near z 8128, a sunken gaming area near 8064 and an upper level near 8448
# (a mezzanine over part of the main floor: the cashier's cage, the Aces
# Theater door, the lounge, Benny and his four bodyguards at the top of the
# stairs). The map is the main floor; both bands reach down 80 units to take
# in the sunken area, which then reads as part of the floor. The seven
# people on the upper level stand on the main-floor hex under them, 0 to 1
# steps away (clamp_levels): Benny and the bodyguards by the foot of the
# stairs among the slot machines, the cashier by the north wall.
# A variant centred on the upper level (floor_z 8448, bands -40..32 and
# -40..100) was built and compared: it shows Benny's group at the stair top
# but only 464 walkable hexes, black voids where the stair well and the
# gaming pit open below, Swank, the Greeter and two Chairmen left out (no
# free hex within 20 steps) and eleven main-floor people pulled up 2 to 10
# steps onto the lounge; the main floor is the better demo.
# Entrance: the front doors by Swank and the Greeter (default was the
# elevator to the Presidential Suite at the far south end).
# Ceiling cut 210 (the default), chosen on engine frames at 210 and 150: 210
# keeps the plants in the entrance planter and on the slot islands and the
# starburst panels on the walls; at 150 those are cut away and nothing
# hidden at 210 opens up.
name = "tops"
worldspace = "TheStripWorldNew"
plugins = ["FalloutNV.esm"]
x = [-4, 2]
y = [-2, 3]
interior_depth = 1
interior = "TOPSCasino"
floor_z = 8128.0
floor_band = [-80.0, 32.0]
walk_band = [-80.0, 100.0]
place_disabled = true
clamp_levels = true
entrance = [1060.0, 3240.0]
cut_height = 210.0
