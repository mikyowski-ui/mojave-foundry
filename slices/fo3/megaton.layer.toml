# Megaton (Fallout 3) as one layer: the town on its levels (crater floor,
# decks and walkways over one another on up to three elevations, the ramps
# between them as exit grids), the entrance inside the gate, and
# Moriarty's Saloon (both its doors: the front on the crater floor, the
# second on the deck above), Craterside Supply and the clinic, linked both
# ways. The other houses keep stub maps. Coordinates and editor ids only.
# Run with --standalone; see docs/running.md ("Layers").
name = "megaton"
start = "megaton"
# Pass 2: a named actor whose packages lead to another map of the layer gets
# a hidden copy there (presence copies).
presence_copies = true
# Pass 2 (task T9): `all` runs the simulation stage after the map stage
# (dialogue, scripts, quests, packages into the layer; needs --f2).
sim = true

[all_maps]
loot = true
# Pass 2: children of enable groups that start disabled are placed hidden.
enable_groups = true
animations = "combat"
wire = true
sight = "visible"

[all_maps.declutter]
profile = "readable"

[[maps]]
slice = "megaton.toml"
map = "megaton"
levels = "auto"
# Inside the gate, by the gate door (the town's own arrival point).
entrance = [-3055.0, -22100.0]

[[maps]]
slice = "megaton-saloon.toml"
map = "moriarty"

[[maps]]
interior = "MegatonCratersideSupply"
map = "crater"
cut_height = 150.0
footprints = true
navmesh_coverage = "share:0.5"

[[maps]]
interior = "MegatonClinic"
map = "clinic"
cut_height = 150.0
footprints = true
navmesh_coverage = "share:0.5"
