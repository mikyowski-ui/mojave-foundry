# Megaton (Fallout 3): the town in its crater. Coordinates only: the
# cells of the town's own worldspace MegatonWorld (it has cells x -2..0,
# y -8..-6 only; the window reaches a little beyond them) and a map centre
# in source units, on the plaza cell (-1, -7). Run with --standalone; see
# docs/running.md.
name = "megaton"
game = "fo3"
worldspace = "MegatonWorld"
plugins = ["Fallout3.esm"]
x = [-2, 0]
y = [-8, -6]
interior_depth = 1
map_center = [-2048.0, -26624.0]
# Phase B: items and loot on, people drawn at the combat level (their
# fights' animations and the weapon in hand). See docs/running.md.
loot = true
animations = "combat"
# The fix pass: the ground outside the wall has no navmesh and no way in
# (closed instead of judged by slope), and the crater's land is painted
# dark in its vertex colours, which its own sunlight lifts: lifted here so
# that the floor does not quantize to black.
navmesh_only = true
vertex_color_floor = 0.4
