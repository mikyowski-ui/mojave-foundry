# Springvale (Fallout 3) and the bandit house its two doors lead into, as
# one layer: the simple control of door links (one exterior, one interior
# of one storey). Coordinates and editor ids only. Run with --standalone;
# see docs/running.md ("Layers").
name = "springvale"
start = "springva"

# What the start cannot reach through the links is closed and reported.
close_unreached = true

[all_maps]
# Islands a strict navmesh coverage rule cuts out of one floor are joined
# again through the hexes the tolerance rule covers.
coverage_bridges = true
loot = true
animations = "combat"
wire = true
sight = "visible"

[all_maps.declutter]
profile = "readable"

[[maps]]
slice = "springvale.toml"
map = "springva"

# No slice file: the exterior's keys, as an interior.
[[maps]]
interior = "zSpringvaleBanditHouse"
map = "bandits"
footprints = true
navmesh_coverage = "share:0.5"
