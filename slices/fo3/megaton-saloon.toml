# Moriarty's Saloon, Megaton (Fallout 3): an interior demo room.
# Coordinates only: the cells of the megaton slice, through whose doors
# extract reaches the room, and the room's cell editor id. Run with
# --standalone; see docs/running.md.
# Ceiling cut 120 (default 210), chosen on engine frames at 210 and 120:
# at 210 the joists and the balcony of the upper floor cover the whole
# room and half the floor is out of reach; at 120 the bar, its stools and
# all six people show and every walkable hex is reached.
name = "megaton-saloon"
game = "fo3"
worldspace = "MegatonWorld"
plugins = ["Fallout3.esm"]
x = [-2, 0]
y = [-8, -6]
interior_depth = 1
interior = "MegatonMoriartysSaloon"
place_disabled = true
cut_height = 120.0
# Phase B: items and loot on, people drawn at the combat level (their
# fights' animations and the weapon in hand). See docs/running.md.
loot = true
animations = "combat"
# No furniture footprints here: with them the bar and the tables close the
# passage to the back (63 of 95 hexes reachable, 110 of 110 without).

[declutter]
profile = "readable"
