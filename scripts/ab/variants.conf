# Readability A/B: the variants and the viewpoints of the contact sheets.
# Read by scripts/readability-ab.sh and the helpers in this directory.
#
# Plain text, one definition per line, `#` starts a comment. Words are split
# like a shell would (double quotes group a word).
#
#   NAME=value                         a variable; `${NAME}` is replaced in
#                                      every later line
#   group NAME layer=FILE base=DIR     a layer file and the warm output
#                                      directory its variants are copied from
#                                      (both relative to the repo root)
#   variant NAME group=G [KEY=VALUE..] one build; each KEY=VALUE is passed as
#                                      `--readability KEY=VALUE`; none means
#                                      today's settings
#   viewpoint G ID map=M.map elev=N target=T label="..."
#                                      one row of group G's contact sheet
#
# A viewpoint target is the thing to photograph, named by REFERENCE and not
# by hex, because hexes change with the world yaw and the unit spacing:
#   entry                    the map's entry hex (the engine starts there)
#   REF[|REF...]             the hex of the first of these that the variant's
#                            map-placements.json places on map M at elevation
#                            N. A REF is `fallout3.esm:003b46` (the reference
#                            id as the index writes it) or `editor:Name` (its
#                            editor id).
# On elevation 0 the shot is a `shots` frame. On elevation 1 or 2 the player
# has to cross the map's stairs: the helper picks the elevation-0 exit grid
# whose arrival hex on that elevation is nearest the target and photographs
# with `walkthrough --through EXIT TARGET` (final frame only).

# ---- The two yaw angles of the comparison (degrees): the lead fills these in.
# Left empty, every variant that needs one stops with a message.
BEST_YAW=90
ALT_YAW=0
# The Super-Duper Mart's own yaw (its default is 0).
MART_YAW=0

# ---- Megaton: ground level, level 1 catwalks, Moriarty's interior.
group megaton layer=slices/fo3/megaton.layer.toml base=out/fix3/megaton
group mart layer=slices/fo3/super-duper-mart.layer.toml base=out/fix3/mart

variant A-current     group=megaton
variant B-context-yaw group=megaton lower_level_dim=0.35 lower_level_desaturate=0.25 world_yaw_deg=${BEST_YAW} mark_links=true fit_view_border=true
variant C-spaced-z75  group=megaton lower_level_dim=0.35 lower_level_desaturate=0.25 world_yaw_deg=${BEST_YAW} mark_links=true units_per_hex=56 wall_z_scale=0.78 fit_view_border=true
variant D-alt-yaw     group=megaton lower_level_dim=0.35 lower_level_desaturate=0.25 world_yaw_deg=${ALT_YAW} mark_links=true units_per_hex=56 wall_z_scale=0.78 fit_view_border=true

# ---- The Super-Duper Mart: today's settings (the sheet's baseline column)
# and C's settings at the Mart's own yaw.
variant E-fit-62      group=megaton lower_level_dim=0.55 lower_level_desaturate=0.25 world_yaw_deg=${BEST_YAW} mark_links=true units_per_hex=62 wall_z_scale=0.78 fit_view_border=true
variant mart-current  group=mart
variant mart-spaced   group=mart lower_level_dim=0.35 lower_level_desaturate=0.25 world_yaw_deg=${MART_YAW} mark_links=true units_per_hex=56 wall_z_scale=0.78 fit_view_border=true

# ---- Megaton viewpoints (rows of megaton-ab-sheet.png, top to bottom).
# Ground level: the gate (Lucas Simms stands inside it), the bomb in the
# middle of the crater, and the floor of Craterside Supply (Moira Brown).
viewpoint megaton gate     map=megaton.map  elev=0 target=fallout3.esm:003b46|editor:LucasSimmsRef label="ground: gate (Lucas Simms)"
viewpoint megaton bomb     map=megaton.map  elev=0 target=fallout3.esm:014bc8|editor:MegatonBombRef label="ground: the bomb"
viewpoint megaton crater   map=crater.map   elev=0 target=fallout3.esm:02d2bc|editor:MoiraBrownREF label="Craterside Supply floor (Moira Brown)"
# Level 1: the catwalk door of Moriarty's Saloon (the front door on the deck).
viewpoint megaton level1   map=megaton.map  elev=1 target=fallout3.esm:003a23|editor:MegMoriartysMainDoorExRef label="level 1: Moriarty's catwalk door"
# Moriarty's interior: the bar (Gob).
viewpoint megaton moriarty map=moriarty.map elev=0 target=fallout3.esm:003b3d|editor:GobRef label="Moriarty's bar (Gob)"

# ---- Super-Duper Mart viewpoints (rows of mart-ab-sheet.png).
# The car park entrance is the exterior map's entry; the aisles are by a raider of the sales floor; the back office
# by the office door; the upper level by a raider on the gantry.
viewpoint mart carpark map=sdmart.map   elev=0 target=entry label="car park entrance"
viewpoint mart aisles  map=sdmartin.map elev=0 target=fallout3.esm:041606 label="sales floor aisles"
viewpoint mart office  map=sdmartin.map elev=0 target=fallout3.esm:0415d8 label="back office door"
viewpoint mart upper   map=sdmartin.map elev=1 target=fallout3.esm:041611 label="upper level"
