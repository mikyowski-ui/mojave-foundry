[workspace]
resolver = "3"
members = [
    "crates/fnv-bsa",
    "crates/fnv-esm",
    "crates/nif",
    "crates/dds",
    "crates/mir",
    "crates/foundry-render",
    "crates/quantize",
    "crates/emit",
    "crates/foundry-gallery",
    "crates/map-terrain",
    "crates/map-slicer",
    "crates/map-builder",
    "crates/mojave-convert",
    "crates/ragdoll",
    "crates/transpile",
]

# Matches vault-engine at the pinned revision: edition 2024, rust-version 1.88.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
# One-way dependency on vault-engine, pinned. Never patch it from here; a
# feature this pipeline needs upstream goes in docs/vault-engine-briefs/.
vault-formats = { git = "https://github.com/mikyowski-ui/vault-engine.git", rev = "3adeac9c0a14bbfbb56a5439155743d401e1bb69" }

fnv-bsa = { path = "crates/fnv-bsa" }
fnv-esm = { path = "crates/fnv-esm" }
nif = { path = "crates/nif" }
dds = { path = "crates/dds" }
mir = { path = "crates/mir" }
foundry-render = { path = "crates/foundry-render" }
quantize = { path = "crates/quantize" }
emit = { path = "crates/emit" }
foundry-gallery = { path = "crates/foundry-gallery" }
map-terrain = { path = "crates/map-terrain" }
map-slicer = { path = "crates/map-slicer" }
map-builder = { path = "crates/map-builder" }

bytemuck = { version = "1.24", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
png = "0.18"
pollster = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
thiserror = "2.0"
toml = "0.9"
wgpu = "27.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Decoders, the software rasterizer and the quantizer run inside tests;
# keep them and every dependency optimized in dev builds.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
